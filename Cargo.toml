[package]
name = "phys-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
nuclear = []

[dependencies]
bevy_ecs = "0.18.1"
encase = "0.12.0"
glam = { version = "0.32.1", features = ["serde"] }
kiddo = "5.3.1"
parry3d-f64 = { version = "0.26.0", features = ["serde-serialize"] }
wgpu = "29.0.1"
winit = "0.30.13"
rayon = "1.10.0"
pollster = "0.3.0"
bytemuck = { version = "1.22", features = ["derive"] }
egui = "0.34"
egui-winit = "0.34"
egui-wgpu = "0.34"
egui_plot = "0.35"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
